services:
  db:
    image: postgres:15
    container_name: ngoni_pay_db
    environment:
      POSTGRES_DB: ngoni_pay_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
